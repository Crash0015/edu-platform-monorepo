version: "3.9"

services:
  # =========================
  # PostgreSQL (Auth / Users)
  # =========================
  postgres:
    image: postgres:16
    container_name: edu-postgres
    environment:
      POSTGRES_USER: edu
      POSTGRES_PASSWORD: edu
      POSTGRES_DB: authdb
    ports:
      - "5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - edu-net

  # =========================
  # PostgreSQL (Enrollment)
  # =========================
  postgres-enrollment:
    image: postgres:16
    container_name: edu-postgres-enrollment
    environment:
      POSTGRES_USER: edu
      POSTGRES_PASSWORD: edu
      POSTGRES_DB: enrollmentdb
    ports:
      - "5434:5432"
    volumes:
      - pg_enrollment_data:/var/lib/postgresql/data
    networks:
      - edu-net

  # =========================
  # MongoDB (Audit / Events)
  # =========================
  mongo:
    image: mongo:7
    container_name: edu-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - edu-net

  # =========================
  # Redis (Cache / Rate Limit)
  # =========================
  redis:
    image: redis:7
    container_name: edu-redis
    ports:
      - "6379:6379"
    networks:
      - edu-net

  # =========================
  # Zookeeper (Kafka)
  # =========================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: edu-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - edu-net

  # =========================
  # Kafka
  # =========================
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: edu-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - edu-net

  # =========================
  # Auth Service
  # =========================
  auth-service:
    build:
      context: ../../apps/auth-service
      dockerfile: Dockerfile
    container_name: edu-auth-service
    environment:
      NODE_ENV: development
      PORT: 3001
      CORS_ORIGINS: http://localhost:3000
      SWAGGER_ENABLED: "true"
      DATABASE_URL: postgresql://edu:edu@postgres:5432/authdb
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: dev_access_secret
      JWT_REFRESH_SECRET: dev_refresh_secret
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      TOKEN_HASH_SECRET: dev_token_hash_secret
      MFA_CHALLENGE_SECRET: dev_mfa_secret
      MFA_CHALLENGE_EXPIRES_IN: 5m
      MFA_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      MFA_ISSUER: UCE Auth
      PASSWORD_RESET_EXPIRES_IN: 30m
      KAFKA_BROKERS: kafka:9092
      KAFKA_CLIENT_ID: auth-service
      KAFKA_ENABLED: "true"
      RATE_LIMIT_LOGIN_MAX: 5
      RATE_LIMIT_LOGIN_WINDOW_SEC: 60
      RATE_LIMIT_REFRESH_MAX: 10
      RATE_LIMIT_REFRESH_WINDOW_SEC: 60
      RATE_LIMIT_FORGOT_MAX: 5
      RATE_LIMIT_FORGOT_WINDOW_SEC: 300
      RATE_LIMIT_RESET_MAX: 5
      RATE_LIMIT_RESET_WINDOW_SEC: 300
    ports:
      - "3001:3001"
    depends_on:
      - postgres
      - redis
      - kafka
    networks:
      - edu-net

  # =========================
  # API Gateway
  # =========================
  api-gateway:
    build:
      context: ../../apps/api-gateway
      dockerfile: Dockerfile
    container_name: edu-api-gateway
    environment:
      NODE_ENV: development
      PORT: 3000
      CORS_ORIGINS: http://localhost:3000
      SWAGGER_ENABLED: "true"
      AUTH_SERVICE_URL: http://auth-service:3001
    ports:
      - "3000:3000"
    depends_on:
      - auth-service
    networks:
      - edu-net

  # =========================
  # Enrollment Service
  # =========================
  enrollment-service:
    build:
      context: ../../apps/enrollment-service
      dockerfile: Dockerfile
    container_name: edu-enrollment-service
    environment:
      NODE_ENV: development
      PORT: 3007
      CORS_ORIGINS: http://localhost:3000
      SWAGGER_ENABLED: "true"
      DATABASE_URL: postgresql://edu:edu@postgres-enrollment:5432/enrollmentdb
      KAFKA_BROKERS: kafka:9092
      KAFKA_CLIENT_ID: enrollment-service
      KAFKA_ENABLED: "true"
    ports:
      - "3007:3007"
    depends_on:
      - postgres-enrollment
      - kafka
    networks:
      - edu-net

  # =========================
  # Search Service
  # =========================
  search-service:
    build:
      context: ../../apps/search-service
      dockerfile: Dockerfile
    container_name: edu-search-service
    environment:
      NODE_ENV: development
      PORT: 3008
      CORS_ORIGINS: http://localhost:3000
      SWAGGER_ENABLED: "true"
      MONGO_URL: mongodb://mongo:27017/search
      KAFKA_BROKERS: kafka:9092
      KAFKA_CLIENT_ID: search-service
      KAFKA_ENABLED: "true"
    ports:
      - "3008:3008"
    depends_on:
      - mongo
      - kafka
    networks:
      - edu-net

  # =========================
  # Notification Service
  # =========================
  notification-service:
    build:
      context: ../../apps/notification-service
      dockerfile: Dockerfile
    container_name: edu-notification-service
    environment:
      NODE_ENV: development
      PORT: 3005
      CORS_ORIGINS: http://localhost:3000
      SWAGGER_ENABLED: "true"
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
    ports:
      - "3005:3005"
    depends_on:
      - rabbitmq
    networks:
      - edu-net

  # =========================
  # Automation Service
  # =========================
  automation-service:
    build:
      context: ../../apps/automation-service
      dockerfile: Dockerfile
    container_name: edu-automation-service
    environment:
      NODE_ENV: development
      PORT: 3006
      CORS_ORIGINS: http://localhost:3000
      SWAGGER_ENABLED: "true"
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      MQTT_URL: mqtt://mqtt:1883
    ports:
      - "3006:3006"
    depends_on:
      - rabbitmq
      - mqtt
    networks:
      - edu-net

  # =========================
  # RabbitMQ
  # =========================
  rabbitmq:
    image: rabbitmq:3-management
    container_name: edu-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - edu-net

  # =========================
  # MQTT (Mosquitto)
  # =========================
  mqtt:
    image: eclipse-mosquitto:2
    container_name: edu-mqtt
    ports:
      - "1883:1883"
    networks:
      - edu-net

networks:
  edu-net:
    driver: bridge

volumes:
  pg_data:
  mongo_data:
  pg_enrollment_data:
