version: "3.9"

services:
  # =========================
  # PostgreSQL (Auth / Users)
  # =========================
  postgres:
    image: postgres:16
    container_name: edu-postgres
    environment:
      POSTGRES_USER: edu
      POSTGRES_PASSWORD: edu
      POSTGRES_DB: authdb
    ports:
      - "5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - edu-net

  # =========================
  # PostgreSQL (Enrollment)
  # =========================
  postgres-enrollment:
    image: postgres:16
    container_name: edu-postgres-enrollment
    environment:
      POSTGRES_USER: edu
      POSTGRES_PASSWORD: edu
      POSTGRES_DB: enrollmentdb
    ports:
      - "5434:5432"
    volumes:
      - pg_enrollment_data:/var/lib/postgresql/data
    networks:
      - edu-net

  # =========================
  # PostgreSQL (Course)
  # =========================
  postgres-course:
    image: postgres:16
    container_name: edu-postgres-course
    environment:
      POSTGRES_USER: edu
      POSTGRES_PASSWORD: edu
      POSTGRES_DB: coursedb
    ports:
      - "5435:5432"
    volumes:
      - pg_course_data:/var/lib/postgresql/data
    networks:
      - edu-net

  # =========================
  # PostgreSQL (Schedule)
  # =========================
  postgres-schedule:
    image: postgres:16
    container_name: edu-postgres-schedule
    environment:
      POSTGRES_USER: edu
      POSTGRES_PASSWORD: edu
      POSTGRES_DB: scheduledb
    ports:
      - "5436:5432"
    volumes:
      - pg_schedule_data:/var/lib/postgresql/data
    networks:
      - edu-net

  # =========================
  # PostgreSQL (Tutoring)
  # =========================
  postgres-tutoring:
    image: postgres:16
    container_name: edu-postgres-tutoring
    environment:
      POSTGRES_USER: edu
      POSTGRES_PASSWORD: edu
      POSTGRES_DB: tutoringdb
    ports:
      - "5437:5432"
    volumes:
      - pg_tutoring_data:/var/lib/postgresql/data
    networks:
      - edu-net

  # =========================
  # MongoDB (Audit / Events)
  # =========================
  mongo:
    image: mongo:7
    container_name: edu-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - edu-net

  # =========================
  # Redis (Cache / Rate Limit)
  # =========================
  redis:
    image: redis:7
    container_name: edu-redis
    ports:
      - "6379:6379"
    networks:
      - edu-net

  # =========================
  # Zookeeper (Kafka)
  # =========================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: edu-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - edu-net

  # =========================
  # Kafka
  # =========================
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: edu-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092" # Puerto extra para acceso externo
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # Definimos dos listeners: INTERNAL (Docker) y EXTERNAL (Host)
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - edu-net

  # =========================
  # Auth Service
  # =========================
  auth-service:
    build:
      context: ../../apps/auth-service
      dockerfile: Dockerfile
    container_name: edu-auth-service
    environment:
      NODE_ENV: development
      PORT: 3001
      GRPC_PORT: 50051
      CORS_ORIGINS: http://localhost:3000
      SWAGGER_ENABLED: "true"
      DATABASE_URL: postgresql://edu:edu@postgres:5432/authdb
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev-access-secret}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev-refresh-secret}
      TOKEN_HASH_SECRET: ${TOKEN_HASH_SECRET:-dev-hash-secret}
      MFA_CHALLENGE_SECRET: ${MFA_CHALLENGE_SECRET:-dev-mfa-secret}
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      RATE_LIMIT_LOGIN_MAX: ${RATE_LIMIT_LOGIN_MAX:-1000}
      RATE_LIMIT_LOGIN_WINDOW_SEC: ${RATE_LIMIT_LOGIN_WINDOW_SEC:-60}
      RATE_LIMIT_REFRESH_MAX: ${RATE_LIMIT_REFRESH_MAX:-1000}
      RATE_LIMIT_REFRESH_WINDOW_SEC: ${RATE_LIMIT_REFRESH_WINDOW_SEC:-60}
      RATE_LIMIT_FORGOT_MAX: ${RATE_LIMIT_FORGOT_MAX:-1000}
      RATE_LIMIT_FORGOT_WINDOW_SEC: ${RATE_LIMIT_FORGOT_WINDOW_SEC:-300}
      RATE_LIMIT_RESET_MAX: ${RATE_LIMIT_RESET_MAX:-1000}
      RATE_LIMIT_RESET_WINDOW_SEC: ${RATE_LIMIT_RESET_WINDOW_SEC:-300}
      KAFKA_ENABLED: ${KAFKA_ENABLED:-true}
      KAFKA_BROKERS: ${KAFKA_BROKERS:-kafka:9092}
    ports:
      - "3001:3001"
      - "50051:50051"
    depends_on:
      - postgres
      - redis
      - kafka
    networks:
      - edu-net

  # =========================
  # User Service
  # =========================
  user-service:
    build:
      context: ../../apps/user-service
      dockerfile: Dockerfile
    container_name: edu-user-service
    environment:
      NODE_ENV: development
      PORT: 3008
      CORS_ORIGINS: http://localhost:3000
      SWAGGER_ENABLED: "true"
    ports:
      - "3008:3008"
    networks:
      - edu-net

  # =========================
  # Course Service
  # =========================
  course-service:
    build:
      context: ../../apps/course-service
      dockerfile: Dockerfile
    container_name: edu-course-service
    environment:
      NODE_ENV: development
      PORT: 3004
      CORS_ORIGINS: http://localhost:3000
      SWAGGER_ENABLED: "true"
      DATABASE_URL: postgresql://edu:edu@postgres-course:5432/coursedb
      KAFKA_BROKERS: kafka:9092
      KAFKA_CLIENT_ID: course-service
      KAFKA_ENABLED: "true"
    ports:
      - "3004:3004"
    depends_on:
      - postgres-course
      - kafka
    networks:
      - edu-net

  # =========================
  # API Gateway
  # =========================
  api-gateway:
    build:
      context: ../../apps/api-gateway
      dockerfile: Dockerfile
    container_name: edu-api-gateway
    environment:
      NODE_ENV: development
      PORT: 3000
      CORS_ORIGINS: http://localhost:3000,http://localhost:3002
      SWAGGER_ENABLED: "true"
      AUTH_SERVICE_URL: http://auth-service:3001
      ENROLLMENT_SERVICE_URL: http://enrollment-service:3007
      COURSE_SERVICE_URL: http://course-service:3004
      USER_SERVICE_URL: http://user-service:3008
      NOTIFICATION_SERVICE_URL: http://notification-service:3005
      AUTOMATION_SERVICE_URL: http://automation-service:3006
      SCHEDULE_SERVICE_URL: http://schedule-service:3009
      TUTORING_SERVICE_URL: http://tutoring-service:3010
      SEARCH_SERVICE_URL: http://search-service:3011
      MATERIAL_SERVICE_URL: http://material-service:3012
    ports:
      - "3000:3000"
    depends_on:
      - enrollment-service
      - course-service
      - user-service
      - notification-service
      - automation-service
      - schedule-service
      - tutoring-service
      - material-service
    networks:
      - edu-net

  # =========================
  # Enrollment Service
  # =========================
  enrollment-service:
    build:
      context: ../../apps/enrollment-service
      dockerfile: Dockerfile
    container_name: edu-enrollment-service
    environment:
      NODE_ENV: development
      PORT: 3007
      CORS_ORIGINS: http://localhost:3000
      SWAGGER_ENABLED: "true"
      DATABASE_URL: postgresql://edu:edu@postgres-enrollment:5432/enrollmentdb
      KAFKA_BROKERS: kafka:9092
      KAFKA_CLIENT_ID: enrollment-service
      KAFKA_ENABLED: "true"
      USER_SERVICE_URL: http://user-service:3008
      COURSE_SERVICE_URL: http://course-service:3004
    ports:
      - "3007:3007"
    depends_on:
      - postgres-enrollment
      - kafka
    networks:
      - edu-net

  # =========================
  # Schedule Service
  # =========================
  schedule-service:
    build:
      context: ../../apps/schedule-service
      dockerfile: Dockerfile
    container_name: edu-schedule-service
    environment:
      NODE_ENV: development
      PORT: 3009
      CORS_ORIGINS: http://localhost:3000,http://localhost:3002
      SWAGGER_ENABLED: "true"
      DATABASE_URL: postgresql://edu:edu@postgres-schedule:5432/scheduledb
      KAFKA_BROKERS: kafka:9092
      KAFKA_CLIENT_ID: schedule-service
      KAFKA_ENABLED: "true"
    ports:
      - "3009:3009"
    depends_on:
      - postgres-schedule
      - kafka
    networks:
      - edu-net

  # =========================
  # Tutoring Service
  # =========================
  tutoring-service:
    build:
      context: ../../apps/tutoring-service
      dockerfile: Dockerfile
    container_name: edu-tutoring-service
    environment:
      NODE_ENV: development
      PORT: 3010
      CORS_ORIGINS: http://localhost:3000
      SWAGGER_ENABLED: "true"
      DATABASE_URL: postgresql://edu:edu@postgres-tutoring:5432/tutoringdb
      KAFKA_BROKERS: kafka:9092
      KAFKA_CLIENT_ID: tutoring-service
      KAFKA_ENABLED: "true"
      SCHEDULE_SERVICE_URL: http://schedule-service:3009
    ports:
      - "3010:3010"
    depends_on:
      - postgres-tutoring
      - schedule-service
      - kafka
    networks:
      - edu-net

  # =========================
  # Search Service
  # =========================
  search-service:
    build:
      context: ../../apps/search-service
      dockerfile: Dockerfile
    container_name: edu-search-service
    environment:
      NODE_ENV: development
      PORT: 3011
      CORS_ORIGINS: http://localhost:3000
      SWAGGER_ENABLED: "true"
      MONGO_URL: mongodb://mongo:27017/search
      KAFKA_BROKERS: kafka:9092
      KAFKA_CLIENT_ID: search-service
      KAFKA_ENABLED: "true"
    ports:
      - "3011:3011"
    depends_on:
      - mongo
      - kafka
    networks:
      - edu-net

  # =========================
  # Material Service
  # =========================
  material-service:
    build:
      context: ../../apps/material-service
      dockerfile: Dockerfile
    container_name: edu-material-service
    environment:
      NODE_ENV: development
      PORT: 3012
      CORS_ORIGINS: http://localhost:3000
      SWAGGER_ENABLED: "true"
      STRAPI_URL: ${STRAPI_URL:-http://host.docker.internal:1337}
      STRAPI_API_TOKEN: ${STRAPI_API_TOKEN:-}
      KAFKA_BROKERS: kafka:9092
      KAFKA_CLIENT_ID: material-service
      KAFKA_ENABLED: "true"
    ports:
      - "3012:3012"
    depends_on:
      - kafka
    networks:
      - edu-net

  # =========================
  # Notification Service
  # =========================
  notification-service:
    build:
      context: ../../apps/notification-service
      dockerfile: Dockerfile
    container_name: edu-notification-service

    environment:
      NODE_ENV: development
      PORT: 3005
      CORS_ORIGINS: http://localhost:3000
      SWAGGER_ENABLED: "true"
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-UCE Platform <no-reply@uce.local>}
      KAFKA_BROKERS: kafka:9092
      KAFKA_CLIENT_ID: notification-service
      KAFKA_ENABLED: "true"
      USER_SERVICE_URL: http://user-service:3008
    ports:
      - "3005:3005"
    depends_on:
      - rabbitmq
    networks:
      - edu-net

  # =========================
  # Automation Service
  # =========================
  automation-service:
    build:
      context: ../../apps/automation-service
      dockerfile: Dockerfile
    container_name: edu-automation-service
    environment:
      NODE_ENV: development
      PORT: 3006
      CORS_ORIGINS: http://localhost:3000
      SWAGGER_ENABLED: "true"
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      MQTT_URL: mqtt://mqtt:1883
    ports:
      - "3006:3006"
    depends_on:
      - rabbitmq
      - mqtt
    networks:
      - edu-net

  # =========================
  # RabbitMQ
  # =========================
  rabbitmq:
    image: rabbitmq:3-management
    container_name: edu-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - edu-net

  # =========================
  # MailHog (SMTP for CI)
  # =========================
  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: edu-mailhog
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - edu-net

  # =========================
  # MQTT (Mosquitto)
  # =========================

  mqtt:
    image: eclipse-mosquitto:2
    container_name: edu-mqtt
    ports:
      - "1883:1883"
    networks:
      - edu-net

networks:
  edu-net:
    driver: bridge

volumes:
  pg_data:
  mongo_data:
  pg_enrollment_data:
  pg_course_data:
  pg_schedule_data:
  pg_tutoring_data:
