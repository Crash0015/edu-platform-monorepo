version: "3.9"

services:
  # =========================
  # API Gateway
  # =========================
  api-gateway:
    build:
      context: ../../apps/api-gateway
      dockerfile: Dockerfile
    container_name: edu-api-gateway
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - AUTH_SERVICE_URL=http://auth-service:3001
      - COURSE_SERVICE_URL=http://course-service:3004
      - ENROLLMENT_SERVICE_URL=http://enrollment-service:3007
      # Add other services as needed
      - CORS_ORIGINS=http://localhost:3002,http://localhost:3000
    depends_on:
      - auth-service
      - course-service
      - enrollment-service
    networks:
      - edu-net

  # =========================
  # Auth Service
  # =========================
  auth-service:
    build:
      context: ../../apps/auth-service
      dockerfile: Dockerfile
    container_name: edu-auth-service
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - NODE_ENV=production
      - DATABASE_URL=postgresql://edu:edu@postgres:5432/authdb?schema=public
      - JWT_SECRET=super-secret-key
      - JWT_EXPIRATION=1d
      - KAFKA_BROKERS=kafka:9092
    depends_on:
      - postgres
      - kafka
    networks:
      - edu-net

  # =========================
  # Course Service
  # =========================
  course-service:
    build:
      context: ../../apps/course-service
      dockerfile: Dockerfile
    container_name: edu-course-service
    ports:
      - "3004:3004"
    environment:
      - PORT=3004
      - NODE_ENV=production
      - DATABASE_URL=postgresql://edu:edu@postgres-course:5432/coursedb?schema=public
      - KAFKA_BROKERS=kafka:9092
    depends_on:
      - postgres-course
      - kafka
    networks:
      - edu-net

  # =========================
  # Enrollment Service
  # =========================
  enrollment-service:
    build:
      context: ../../apps/enrollment-service
      dockerfile: Dockerfile
    container_name: edu-enrollment-service
    ports:
      - "3007:3007"
    environment:
      - PORT=3007
      - NODE_ENV=production
      - DATABASE_URL=postgresql://edu:edu@postgres-enrollment:5432/enrollmentdb?schema=public
      - COURSE_SERVICE_URL=http://course-service:3004
      - KAFKA_BROKERS=kafka:9092
    depends_on:
      - postgres-enrollment
      - kafka
    networks:
      - edu-net
