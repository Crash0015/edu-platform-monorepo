name: Integration Flow

on:
  workflow_dispatch:
  pull_request:

jobs:
  enrollment-flow:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Start integration stack
        run: docker compose --env-file infra/docker/.env.ci -f infra/docker/docker-compose.local.yml up -d postgres-enrollment zookeeper kafka rabbitmq user-service course-service enrollment-service notification-service api-gateway mailhog

      - name: Wait for gateway
        run: |
          for i in {1..30}; do
            if curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/health | grep -q "200"; then
              exit 0
            fi
            sleep 5
          done
          echo "api-gateway did not become healthy" && exit 1

      - name: Run enrollment migration
        run: docker exec edu-enrollment-service npm run prisma:migrate

      - name: Clear enrollments
        run: docker exec edu-postgres-enrollment psql -U edu -d enrollmentdb -c "TRUNCATE enrollments;"

      - name: Trigger enrollment via gateway
        run: |
          curl -s -X POST http://localhost:3000/api/v1/gateway/enrollments/assign \
            -H "Content-Type: application/json" \
            -H "x-user-id: 33333333-3333-3333-3333-333333333333" \
            -H "x-user-roles: TEACHER" \
            -d '{"studentId":"11111111-1111-1111-1111-111111111111","courseId":"22222222-2222-2222-2222-222222222222","correlationId":"ci-flow-001"}'

      - name: Verify email in MailHog
        run: |
          for i in {1..30}; do
          COUNT=$(curl -s http://localhost:8025/api/v2/messages | grep -o '"total":[0-9]*' | cut -d: -f2)
          if [ "${COUNT:-0}" -ge 1 ]; then
            curl -s http://localhost:8025/api/v2/messages | grep -o '"Subject":\[[^]]*' | head -n 1
            exit 0
          fi

            sleep 2
          done
          echo "No email received in MailHog" && exit 1

      - name: Shutdown stack
        if: always()
        run: docker compose -f infra/docker/docker-compose.local.yml down -v
