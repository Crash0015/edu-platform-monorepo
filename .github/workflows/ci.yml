name: CI

on:
  push:
  pull_request:
    paths:
      - 'infra/terraform/**'
      - '.github/workflows/ci.yml'
  workflow_dispatch:
    inputs:
      terraform_action:
        description: 'Terraform action (plan/apply/destroy)'
        required: false
        type: choice
        options:
          - plan
          - apply
          - destroy
      terraform_environment:
        description: 'Environment (qa)'
        required: false
        type: choice
        options:
          - qa

jobs:
  lint-and-test:
    name: Lint & Unit (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - auth-service
          - notification-service
          - automation-service
          - enrollment-service
          - search-service
          - course-service
          - user-service


    defaults:
      run:
        working-directory: apps/${{ matrix.service }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/${{ matrix.service }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate (auth/enrollment)
        if: matrix.service == 'auth-service' || matrix.service == 'enrollment-service'
        run: |
          if [ "${{ matrix.service }}" = "auth-service" ]; then
            DATABASE_URL=postgresql://edu:edu@localhost:5433/authdb npm run prisma:generate
          else
            DATABASE_URL=postgresql://edu:edu@localhost:5434/enrollmentdb npm run prisma:generate
          fi

      - name: Lint (typecheck)
        run: npx tsc -p tsconfig.build.json --noEmit


      - name: Unit tests
        run: npm run test:unit

  auth-e2e:
    name: Auth E2E
    runs-on: ubuntu-latest
    needs: lint-and-test

    defaults:
      run:
        working-directory: apps/auth-service
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/auth-service/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: E2E tests (auth-service)
        run: DATABASE_URL=postgresql://edu:edu@localhost:5433/authdb npm run test:e2e

  auth-load-test:
    name: Auth Load Test
    runs-on: ubuntu-latest
    needs: auth-e2e

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/auth-service/package-lock.json

      - name: Install auth-service dependencies
        run: npm ci
        working-directory: apps/auth-service

      - name: Start auth dependencies
        run: KAFKA_ENABLED=false docker compose -f infra/docker/docker-compose.yml --profile dev up -d postgres redis

      - name: Wait for postgres
        run: |
          for i in {1..30}; do
            if docker exec edu-postgres pg_isready -U edu -d authdb; then
              exit 0
            fi
            sleep 2
          done
          echo "postgres did not become ready" && exit 1

      - name: Run auth migrations
        run: DATABASE_URL=postgresql://edu:edu@localhost:5433/authdb npx prisma migrate deploy --schema prisma/schema.prisma
        working-directory: apps/auth-service

      - name: Start auth-service
        run: |
          KAFKA_ENABLED=false \
          RATE_LIMIT_LOGIN_MAX=10000 \
          RATE_LIMIT_LOGIN_WINDOW_SEC=60 \
          RATE_LIMIT_REFRESH_MAX=10000 \
          RATE_LIMIT_REFRESH_WINDOW_SEC=60 \
          docker compose -f infra/docker/docker-compose.yml --profile dev up -d auth-service

      - name: Show auth-service logs
        if: failure()
        run: docker logs edu-auth-service --tail 200

      - name: Wait for auth-service
        run: |
          for i in {1..40}; do
            if curl -s -o /dev/null -w "%{http_code}" http://localhost:3001/health | grep -q "200"; then
              exit 0
            fi
            sleep 5
          done
          echo "auth-service did not become healthy"
          docker ps -a
          docker logs edu-auth-service --tail 200 || true
          exit 1


      - name: Seed auth user
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST http://localhost:3001/api/v1/auth/register \
            -H "Content-Type: application/json" \
            -d '{"email":"student@uce.edu.ec","password":"Password123!","fullName":"Load Test","userType":"STUDENT"}')
          if [ "$STATUS" != "201" ] && [ "$STATUS" != "400" ]; then
            echo "Unexpected register status: $STATUS" && exit 1
          fi

      - name: Run k6 load test
        run: |
          docker run --rm --network host \
            -e AUTH_BASE_URL=http://localhost:3001 \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            grafana/k6 run tools/k6/auth-service.js

      - name: Shutdown compose
        if: always()
        run: docker compose -f infra/docker/docker-compose.yml --profile dev down -v

  integration-flow:
    name: Integration Flow
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: github.event_name != 'push' || github.ref != 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Start integration stack
        run: docker compose --env-file infra/docker/.env.ci -f infra/docker/docker-compose.yml --profile dev up -d postgres postgres-course postgres-enrollment redis zookeeper kafka rabbitmq auth-service user-service course-service enrollment-service notification-service mailhog

      - name: Wait for auth service
        run: |
          for i in {1..30}; do
            if curl -s -o /dev/null -w "%{http_code}" http://localhost:3001/health | grep -q "200"; then
              exit 0
            fi
            sleep 5
          done
          echo "auth-service did not become healthy" && exit 1

      - name: Run enrollment migration
        run: docker exec edu-enrollment-service npm run prisma:migrate

      - name: Run auth migration
        run: docker exec -e DATABASE_URL=postgresql://edu:edu@postgres:5432/authdb edu-auth-service npm run prisma:migrate

      - name: Run course migration
        run: docker exec edu-course-service npm run prisma:migrate

      - name: Seed course
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST http://localhost:3004/api/v1/courses \
            -H "Content-Type: application/json" \
            -H "x-user-id: 33333333-3333-3333-3333-333333333333" \
            -H "x-user-roles: TEACHER" \
            -d '{"code":"CI-101","name":"Curso CI","description":"Curso de integracion","capacity":5}')
          if [ "$STATUS" != "201" ] && [ "$STATUS" != "400" ]; then
            echo "Unexpected course create status: $STATUS" && exit 1
          fi

      - name: Clear enrollments
        run: docker exec edu-postgres-enrollment psql -U edu -d enrollmentdb -c "TRUNCATE enrollments;"

      - name: Resolve course ID
        id: course
        run: |
          COURSE_ID=$(curl -s http://localhost:3004/api/v1/courses/code/CI-101 | node -e "const fs=require('fs'); const raw=fs.readFileSync(0,'utf8').trim(); if (!raw) process.exit(1); const data=JSON.parse(raw); if (!data.id) process.exit(1); process.stdout.write(data.id);")
          echo "course_id=$COURSE_ID" >> $GITHUB_OUTPUT

      - name: Trigger enrollment via gateway
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST http://localhost:3000/api/v1/gateway/enrollments/assign-with-profile \
            -H "Content-Type: application/json" \
            -H "x-user-id: 33333333-3333-3333-3333-333333333333" \
            -H "x-user-roles: TEACHER" \
            -d '{"email":"student@example.com","fullName":"CI Student","courseId":"${{ steps.course.outputs.course_id }}","correlationId":"ci-flow-001"}')
          if [ "$STATUS" != "201" ] && [ "$STATUS" != "400" ]; then
            echo "Unexpected enroll status: $STATUS" && exit 1
          fi

      - name: Verify email in MailHog
        run: |
          for i in {1..30}; do
          COUNT=$(curl -s http://localhost:8025/api/v2/messages | grep -o '"total":[0-9]*' | cut -d: -f2)
          if [ "${COUNT:-0}" -ge 1 ]; then
            curl -s http://localhost:8025/api/v2/messages | grep -o '"Subject":\[[^]]*' | head -n 1
            exit 0
          fi

            sleep 2
          done
          echo "No email received in MailHog" && exit 1

      - name: Shutdown stack
        if: always()
        run: docker compose -f infra/docker/docker-compose.yml --profile dev down -v

  docker-publish:
    name: Docker Build & Push (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: [lint-and-test, auth-e2e, auth-load-test]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/qa')
    strategy:
      fail-fast: false
        matrix:
          service:
          - auth-service
          - course-service
          - enrollment-service
          - notification-service
          - automation-service
          - material-service
          - schedule-service
          - search-service
          - tutoring-service
          - user-service
          - web-dashboard
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/edu-${{ matrix.service }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service == 'web-dashboard' && 'frontend/web-dashboard' || format('apps/{0}', matrix.service) }}
          file: ${{ matrix.service == 'web-dashboard' && 'frontend/web-dashboard/Dockerfile' || format('apps/{0}/Dockerfile', matrix.service) }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/edu-${{ matrix.service }}:latest
          cache-to: type=inline
        env:
          DOCKER_BUILDKIT: 1
        continue-on-error: true
      - name: Retry build on rate limit
        if: failure()
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service == 'web-dashboard' && 'frontend/web-dashboard' || format('apps/{0}', matrix.service) }}
          file: ${{ matrix.service == 'web-dashboard' && 'frontend/web-dashboard/Dockerfile' || format('apps/{0}/Dockerfile', matrix.service) }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/edu-${{ matrix.service }}:latest
          cache-to: type=inline
        env:
          DOCKER_BUILDKIT: 1

      - name: Image pushed
        run: echo "Image pushed successfully"

  docker-publish-complete:
    name: Docker Publish Complete
    runs-on: ubuntu-latest
    needs: docker-publish
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/qa')
    steps:
      - name: All images published
        run: echo "All Docker images have been published successfully"

  terraform-apply-qa:
    name: Terraform Apply (QA)
    runs-on: ubuntu-latest
    needs: docker-publish-complete
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/qa')
    defaults:
      run:
        working-directory: infra/terraform/qa
    env:
      TF_VERSION: '1.14.3'
      AWS_REGION: 'us-east-1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
        run: terraform init

      - name: Terraform Validate
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
        run: terraform validate

      - name: Terraform Plan
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
        run: |
          terraform plan \
            -var="aws_access_key=${{ secrets.AWS_ACCESS_KEY_ID }}" \
            -var="aws_secret_key=${{ secrets.AWS_SECRET_ACCESS_KEY }}" \
            -var="aws_session_token=${{ secrets.AWS_SESSION_TOKEN }}" \
            -var="dockerhub_username=${{ secrets.DOCKERHUB_USERNAME }}" \
            -var="dockerhub_token=${{ secrets.DOCKERHUB_TOKEN }}" \
            -out=tfplan

      - name: Terraform Apply
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
        run: terraform apply -auto-approve tfplan

      - name: Output Infrastructure Info
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
        run: |
          echo "=========================================="
          echo "🚀 INFRAESTRUCTURA DESPLEGADA EXITOSAMENTE"
          echo "=========================================="
          echo ""
          terraform output
          echo ""
          echo "=========================================="
          echo "🌐 URL DEL FRONTEND:"
          echo "=========================================="
          ELB_DNS=$(terraform output -raw elb_dns_name)
          echo "Frontend URL: http://$ELB_DNS"
          echo "API Gateway URL: http://$ELB_DNS/api/v1"
          echo ""
          echo "=========================================="
          echo "✅ Puedes acceder a tu aplicación en:"
          echo "   http://$ELB_DNS"
          echo "=========================================="

  terraform-plan-pr:
    name: Terraform Plan PR (${{ matrix.environment }})
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        environment: [qa]
    defaults:
      run:
        working-directory: infra/terraform/${{ matrix.environment }}
    env:
      TF_VERSION: '1.14.3'
      AWS_REGION: 'us-east-1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: terraform init -backend=false

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        id: tf-plan
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
        run: |
          terraform plan -no-color \
            -var="aws_access_key=${{ secrets.AWS_ACCESS_KEY_ID }}" \
            -var="aws_secret_key=${{ secrets.AWS_SECRET_ACCESS_KEY }}" \
            -var="aws_session_token=${{ secrets.AWS_SESSION_TOKEN }}" \
            -var="dockerhub_username=${{ secrets.DOCKERHUB_USERNAME }}" \
            -var="dockerhub_token=${{ secrets.DOCKERHUB_TOKEN }}" \
            -out=tfplan 2>&1 | tee plan_output.txt
        continue-on-error: true

      - name: Comment PR
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const planOutput = fs.existsSync('plan_output.txt') 
              ? fs.readFileSync('plan_output.txt', 'utf8') 
              : 'Plan output not available';
            
            const output = `#### Terraform Plan (${{ matrix.environment }}) 📖
            \`\`\`
            ${planOutput}
            \`\`\`
            *Pusher: @${{ github.actor }}, Action: \`${{ github.event_name }}\`*`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })

  terraform-manual:
    name: Terraform Manual (${{ github.event.inputs.terraform_environment }})
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.terraform_action != ''
    defaults:
      run:
        working-directory: infra/terraform/${{ github.event.inputs.terraform_environment }}
    env:
      TF_VERSION: '1.14.3'
      AWS_REGION: 'us-east-1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
        run: terraform init

      - name: Terraform ${{ github.event.inputs.terraform_action }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
        run: |
          if [ "${{ github.event.inputs.terraform_action }}" = "plan" ]; then
            terraform plan \
              -var="aws_access_key=${{ secrets.AWS_ACCESS_KEY_ID }}" \
              -var="aws_secret_key=${{ secrets.AWS_SECRET_ACCESS_KEY }}" \
              -var="aws_session_token=${{ secrets.AWS_SESSION_TOKEN }}" \
              -var="dockerhub_username=${{ secrets.DOCKERHUB_USERNAME }}" \
              -var="dockerhub_token=${{ secrets.DOCKERHUB_TOKEN }}"
          elif [ "${{ github.event.inputs.terraform_action }}" = "apply" ]; then
            terraform apply -auto-approve \
              -var="aws_access_key=${{ secrets.AWS_ACCESS_KEY_ID }}" \
              -var="aws_secret_key=${{ secrets.AWS_SECRET_ACCESS_KEY }}" \
              -var="aws_session_token=${{ secrets.AWS_SESSION_TOKEN }}" \
              -var="dockerhub_username=${{ secrets.DOCKERHUB_USERNAME }}" \
              -var="dockerhub_token=${{ secrets.DOCKERHUB_TOKEN }}"
          elif [ "${{ github.event.inputs.terraform_action }}" = "destroy" ]; then
            terraform destroy -auto-approve \
              -var="aws_access_key=${{ secrets.AWS_ACCESS_KEY_ID }}" \
              -var="aws_secret_key=${{ secrets.AWS_SECRET_ACCESS_KEY }}" \
              -var="aws_session_token=${{ secrets.AWS_SESSION_TOKEN }}" \
              -var="dockerhub_username=${{ secrets.DOCKERHUB_USERNAME }}" \
              -var="dockerhub_token=${{ secrets.DOCKERHUB_TOKEN }}"
          fi
