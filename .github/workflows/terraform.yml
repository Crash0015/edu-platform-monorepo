name: Terraform Infrastructure

on:
  pull_request:
    paths:
      - 'infra/terraform/**'
      - '.github/workflows/terraform.yml'
  push:
    branches:
      - main
      - qa
      - prod
    paths:
      - 'infra/terraform/**'
      - '.github/workflows/terraform.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy (qa or prod)'
        required: true
        type: choice
        options:
          - qa
          - prod
      action:
        description: 'Terraform action'
        required: true
        type: choice
        options:
          - plan
          - apply
          - destroy

env:
  TF_VERSION: '1.14.3'
  AWS_REGION: 'us-east-1'

jobs:
  terraform-plan:
    name: Terraform Plan (${{ matrix.environment }})
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        environment: [qa, prod]
    defaults:
      run:
        working-directory: infra/terraform/${{ matrix.environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: terraform init -backend=false

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        id: tf-plan
        env:
          AWS_ACCESS_KEY_ID: ${{ matrix.environment == 'qa' && secrets.AWS_ACCESS_KEY_ID_QA || secrets.AWS_ACCESS_KEY_ID_PROD }}
          AWS_SECRET_ACCESS_KEY: ${{ matrix.environment == 'qa' && secrets.AWS_SECRET_ACCESS_KEY_QA || secrets.AWS_SECRET_ACCESS_KEY_PROD }}
          AWS_SESSION_TOKEN: ${{ matrix.environment == 'qa' && secrets.AWS_SESSION_TOKEN_QA || secrets.AWS_SESSION_TOKEN_PROD }}
        run: |
          terraform plan -no-color \
            -var="aws_access_key=${{ matrix.environment == 'qa' && secrets.AWS_ACCESS_KEY_ID_QA || secrets.AWS_ACCESS_KEY_ID_PROD }}" \
            -var="aws_secret_key=${{ matrix.environment == 'qa' && secrets.AWS_SECRET_ACCESS_KEY_QA || secrets.AWS_SECRET_ACCESS_KEY_PROD }}" \
            -var="aws_session_token=${{ matrix.environment == 'qa' && secrets.AWS_SESSION_TOKEN_QA || secrets.AWS_SESSION_TOKEN_PROD }}" \
            -out=tfplan 2>&1 | tee plan_output.txt
        continue-on-error: true

      - name: Comment PR
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const planOutput = fs.existsSync('plan_output.txt') 
              ? fs.readFileSync('plan_output.txt', 'utf8') 
              : 'Plan output not available';
            
            const output = `#### Terraform Plan (${{ matrix.environment }}) 📖
            \`\`\`
            ${planOutput}
            \`\`\`
            *Pusher: @${{ github.actor }}, Action: \`${{ github.event_name }}\`*`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })

  terraform-apply-qa:
    name: Terraform Apply (QA)
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'push' && 
      (github.ref == 'refs/heads/qa' || github.ref == 'refs/heads/main')
    defaults:
      run:
        working-directory: infra/terraform/qa
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID_QA }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY_QA }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN_QA }}
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID_QA }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY_QA }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN_QA }}
        run: |
          terraform plan \
            -var="aws_access_key=${{ secrets.AWS_ACCESS_KEY_ID_QA }}" \
            -var="aws_secret_key=${{ secrets.AWS_SECRET_ACCESS_KEY_QA }}" \
            -var="aws_session_token=${{ secrets.AWS_SESSION_TOKEN_QA }}" \
            -out=tfplan

      - name: Terraform Apply
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID_QA }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY_QA }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN_QA }}
        run: terraform apply -auto-approve tfplan

      - name: Output Infrastructure Info
        run: terraform output

  terraform-apply-prod:
    name: Terraform Apply (PROD)
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'push' && 
      github.ref == 'refs/heads/prod'
    defaults:
      run:
        working-directory: infra/terraform/prod
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID_PROD }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY_PROD }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN_PROD }}
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID_PROD }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY_PROD }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN_PROD }}
        run: |
          terraform plan \
            -var="aws_access_key=${{ secrets.AWS_ACCESS_KEY_ID_PROD }}" \
            -var="aws_secret_key=${{ secrets.AWS_SECRET_ACCESS_KEY_PROD }}" \
            -var="aws_session_token=${{ secrets.AWS_SESSION_TOKEN_PROD }}" \
            -out=tfplan

      - name: Terraform Apply
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID_PROD }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY_PROD }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN_PROD }}
        run: terraform apply -auto-approve tfplan

      - name: Output Infrastructure Info
        run: terraform output

  terraform-manual:
    name: Terraform Manual (${{ github.event.inputs.environment }})
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    defaults:
      run:
        working-directory: infra/terraform/${{ github.event.inputs.environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        env:
          AWS_ACCESS_KEY_ID: ${{ github.event.inputs.environment == 'qa' && secrets.AWS_ACCESS_KEY_ID_QA || secrets.AWS_ACCESS_KEY_ID_PROD }}
          AWS_SECRET_ACCESS_KEY: ${{ github.event.inputs.environment == 'qa' && secrets.AWS_SECRET_ACCESS_KEY_QA || secrets.AWS_SECRET_ACCESS_KEY_PROD }}
          AWS_SESSION_TOKEN: ${{ github.event.inputs.environment == 'qa' && secrets.AWS_SESSION_TOKEN_QA || secrets.AWS_SESSION_TOKEN_PROD }}
        run: terraform init

      - name: Terraform ${{ github.event.inputs.action }}
        env:
          AWS_ACCESS_KEY_ID: ${{ github.event.inputs.environment == 'qa' && secrets.AWS_ACCESS_KEY_ID_QA || secrets.AWS_ACCESS_KEY_ID_PROD }}
          AWS_SECRET_ACCESS_KEY: ${{ github.event.inputs.environment == 'qa' && secrets.AWS_SECRET_ACCESS_KEY_QA || secrets.AWS_SECRET_ACCESS_KEY_PROD }}
          AWS_SESSION_TOKEN: ${{ github.event.inputs.environment == 'qa' && secrets.AWS_SESSION_TOKEN_QA || secrets.AWS_SESSION_TOKEN_PROD }}
        run: |
          if [ "${{ github.event.inputs.action }}" = "plan" ]; then
            terraform plan \
              -var="aws_access_key=${{ github.event.inputs.environment == 'qa' && secrets.AWS_ACCESS_KEY_ID_QA || secrets.AWS_ACCESS_KEY_ID_PROD }}" \
              -var="aws_secret_key=${{ github.event.inputs.environment == 'qa' && secrets.AWS_SECRET_ACCESS_KEY_QA || secrets.AWS_SECRET_ACCESS_KEY_PROD }}" \
              -var="aws_session_token=${{ github.event.inputs.environment == 'qa' && secrets.AWS_SESSION_TOKEN_QA || secrets.AWS_SESSION_TOKEN_PROD }}"
          elif [ "${{ github.event.inputs.action }}" = "apply" ]; then
            terraform apply -auto-approve \
              -var="aws_access_key=${{ github.event.inputs.environment == 'qa' && secrets.AWS_ACCESS_KEY_ID_QA || secrets.AWS_ACCESS_KEY_ID_PROD }}" \
              -var="aws_secret_key=${{ github.event.inputs.environment == 'qa' && secrets.AWS_SECRET_ACCESS_KEY_QA || secrets.AWS_SECRET_ACCESS_KEY_PROD }}" \
              -var="aws_session_token=${{ github.event.inputs.environment == 'qa' && secrets.AWS_SESSION_TOKEN_QA || secrets.AWS_SESSION_TOKEN_PROD }}"
          elif [ "${{ github.event.inputs.action }}" = "destroy" ]; then
            terraform destroy -auto-approve \
              -var="aws_access_key=${{ github.event.inputs.environment == 'qa' && secrets.AWS_ACCESS_KEY_ID_QA || secrets.AWS_ACCESS_KEY_ID_PROD }}" \
              -var="aws_secret_key=${{ github.event.inputs.environment == 'qa' && secrets.AWS_SECRET_ACCESS_KEY_QA || secrets.AWS_SECRET_ACCESS_KEY_PROD }}" \
              -var="aws_session_token=${{ github.event.inputs.environment == 'qa' && secrets.AWS_SESSION_TOKEN_QA || secrets.AWS_SESSION_TOKEN_PROD }}"
          fi
